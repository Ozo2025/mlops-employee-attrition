name: MLOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: |
          mkdir -p data
          curl -L \
            https://raw.githubusercontent.com/nelson-wu/employee-attrition-ml/master/WA_Fn-UseC_-HR-Employee-Attrition.csv \
            -o data/employee_attrition.csv

      - name: Simulate missing values
        run: |
          python - <<'PY'
          import pandas as pd
          import numpy as np

          path = "data/employee_attrition.csv"
          df = pd.read_csv(path)

          rng = np.random.default_rng(42)

          for column in [
              "Age",
              "MonthlyIncome",
              "JobRole",
              "MaritalStatus",
          ]:
              indices = rng.choice(
                  df.index,
                  size=30,
                  replace=False,
              )
              df.loc[indices, column] = np.nan

          df.to_csv(path, index=False)
          print("Missing values:", df.isna().sum().sum())
          PY

      - name: Run test suite
        run: |
          pytest tests/ -v

  train:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: |
          mkdir -p data
          curl -L \
            https://raw.githubusercontent.com/nelson-wu/employee-attrition-ml/master/WA_Fn-UseC_-HR-Employee-Attrition.csv \
            -o data/employee_attrition.csv

      - name: Simulate missing values
        run: |
          python - <<'PY'
          import pandas as pd
          import numpy as np

          path = "data/employee_attrition.csv"
          df = pd.read_csv(path)

          rng = np.random.default_rng(42)

          for column in [
              "Age",
              "MonthlyIncome",
              "JobRole",
              "MaritalStatus",
          ]:
              indices = rng.choice(
                  df.index,
                  size=30,
                  replace=False,
              )
              df.loc[indices, column] = np.nan

          df.to_csv(path, index=False)
          print("Missing values:", df.isna().sum().sum())
          PY

      - name: Train model
        run: |
          python -m src.train